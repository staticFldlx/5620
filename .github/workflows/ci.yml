name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: npm run lint && npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test --if-present

  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      LLM_PROVIDER: fake # CI never calls a real LLM and needs no API key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Test
        run: python -m pytest

  browser:
    name: Browser regressions (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [inline, worker]
    env:
      LLM_PROVIDER: fake
      AGENT_TASK_EXECUTION: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements-dev.txt
      - name: Frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Real server browser regressions
        working-directory: frontend
        run: npm run test:e2e
      - name: Offline demo compatibility
        if: matrix.mode == 'inline'
        working-directory: frontend
        run: npm run test:e2e:mock
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures-${{ matrix.mode }}
          path: frontend/test-results/
